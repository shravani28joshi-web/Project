<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CrimeTracker | Evidence Collection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    color: #1f2937;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.form-card {
    background: #ffffff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 18px;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
}

textarea {
    resize: vertical;
}

input[type="file"] {
    padding: 6px;
}

button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #1e4fd8;
}

/* -------- THUMBNAIL PREVIEW -------- */
.preview-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.preview-item {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
}

.preview-item img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 6px;
}

.preview-item span {
    display: block;
    font-size: 12px;
    margin-top: 6px;
}
</style>
</head>

<body>

<div class="container">
<h1>Evidence Collection Form</h1>

<div class="form-card">
<form>

<div class="form-group">
<label>Case ID / FIR Number</label>
<input type="text" placeholder="e.g. FIR/112/2025" required>
</div>

<div class="form-group">
<label>Evidence Type</label>
<select required>
<option value="">Select Evidence Type</option>
<option>Phishing Email Screenshot</option>
<option>CCTV Footage</option>
<option>Bank Transaction Records</option>
<option>Weapon</option>
<option>Fingerprint / Biometric</option>
<option>Mobile Device Image</option>
<option>Call Recordings</option>
<option>Email / Chat Screenshots</option>
<option>Other Digital Evidence</option>
</select>
</div>

<div class="form-group">
<label>Evidence Description</label>
<textarea rows="4" placeholder="Brief description of the evidence"></textarea>
</div>

<div class="form-group">
<label>Upload Evidence Files (Images / Videos / Documents)</label>
<input type="file" multiple accept="image/*,video/*,.pdf" onchange="previewFiles(this)">
</div>

<div class="preview-container" id="preview"></div>

<div class="form-group">
<label>Collected By (Officer Name)</label>
<input type="text" placeholder="Investigating Officer Name">
</div>

<div class="form-group">
<label>Date of Collection</label>
<input type="date">
</div>

<button type="submit">Submit Evidence</button>

</form>
</div>
</div>

<script>
function previewFiles(input) {
    const preview = document.getElementById('preview');
    preview.innerHTML = "";

    Array.from(input.files).forEach(file => {
        if (!file.type.startsWith("image/")) return;

        const reader = new FileReader();
        reader.onload = e => {
            const div = document.createElement("div");
            div.className = "preview-item";
            div.innerHTML = `
                <img src="${e.target.result}">
                <span>${file.name}</span>
            `;
            preview.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
